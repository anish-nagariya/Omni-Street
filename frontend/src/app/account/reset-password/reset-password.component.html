<div class="container" style="height: 100vh">
  <div class="row justify-content-center align-items-center h-100">
    <div class="col-md-5 col-sm-8">
      <mat-card>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <mat-card-header>
            <mat-card-title>Reset Password</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <div>
              <mat-form-field class="full-width-input">
                <mat-label>Username</mat-label>
                <input
                  matInput
                  type="text"
                  formControlName="username"
                  required
                />
                <mat-error> Username is required </mat-error>
              </mat-form-field>
              <mat-form-field class="full-width-input">
                <mat-label>Password</mat-label>
                <input
                  matInput
                  type="password"
                  formControlName="password"
                  required
                />
                <mat-error *ngIf="f.password.errors?.required">
                  Password is required
                </mat-error>
                <mat-error *ngIf="f.password.errors?.minlength">
                  Password must be at least 6 characters
                </mat-error>
              </mat-form-field>
              <mat-form-field class="full-width-input">
                <mat-label>Confirm Password</mat-label>
                <input
                  matInput
                  type="password"
                  formControlName="confirmPassword"
                  required
                />
                <mat-error *ngIf="f.confirmPassword.errors?.required">
                  Confirm Password is required
                </mat-error>
                <mat-error *ngIf="f.confirmPassword.errors?.mustMatch">
                  Passwords must match
                </mat-error>
              </mat-form-field>
            </div>
          </mat-card-content>
          <mat-card-actions>
            <div class="btn-group-vertical" role="group">
              <button class="btn btn-primary text-dark" [disabled]="loading">
                <span
                  *ngIf="loading"
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true"
                ></span>
                Reset Password
              </button>
              <button
                class="btn btn-link text-primary"
                [disabled]="loading"
                routerLink="../login"
              >
                Cancel
              </button>
            </div>
          </mat-card-actions>
        </form>
      </mat-card>
    </div>
  </div>
</div>
