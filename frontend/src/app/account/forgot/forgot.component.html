<div class="container" style="height: 100vh">
  <div class="row justify-content-center align-items-center h-100">
    <div class="col-md-5 col-sm-8">
      <mat-card>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <mat-card-header>
            <mat-card-title>Forgot Username or Password</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <mat-form-field class="full-width-input">
              <mat-label>Reset Token</mat-label>
              <input
                matInput
                type="text"
                formControlName="token"
                required
              />
              <mat-error *ngIf="f.token.errors?.minLength || f.token.errors?.maxLength">
                Please enter your 16 digit reset code
              </mat-error>
              <mat-error *ngIf="f.token.errors?.required">
                Reset Token is <strong>required</strong>
              </mat-error>
            </mat-form-field>
          </mat-card-content>
          <mat-card-actions>
            <div class="btn-group" role="group">
              <button class="btn btn-primary text-dark" [disabled]="loading">
                <span
                  *ngIf="loading"
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true"
                ></span>
                Submit
              </button>
              <button
                class="btn btn-link text-primary"
                [disabled]="loading"
                routerLink="../login"
              >
                Cancel
              </button>
            </div>
          </mat-card-actions>
        </form>
      </mat-card>
    </div>
  </div>
</div>
